[project]
name = "couch-oracle"
version = "0.1.0"
description = "Self-hosted recommender for movies, TV shows, books and video games"
readme = "README.md"
authors = [
    { name = "Pablo Herranz Ramírez", email = "pablo.herranz@suse.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.150.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
couch-oracle = "couch_oracle:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
